name: debug-core-tests

# Temporary: reproduces individual package test scripts on GitHub-hosted runners with full output.
on:
  workflow_dispatch:

jobs:
  windows-util:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-2022]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      - name: Report tooling versions
        run: |
          bun --version
          ver || true

      - name: Run util tests
        working-directory: packages/util
        timeout-minutes: 15
        env:
          GITHUB_ACTIONS: "false"
        run: bun test --only-failures 2>&1 | tail -200
