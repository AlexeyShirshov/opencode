name: debug-core-tests

# Temporary: narrows down the bun 1.4.2 crash in packages/util on the windows-2025 image.
on:
  workflow_dispatch:

jobs:
  windows-util:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      - name: bun test
        working-directory: packages/util
        continue-on-error: true
        run: bun test 2>&1 | tail -5

      - name: bun test --only-failures
        working-directory: packages/util
        continue-on-error: true
        run: bun test --only-failures 2>&1 | tail -5

      - name: bun run test
        working-directory: packages/util
        continue-on-error: true
        run: bun run test 2>&1 | tail -20

      - name: bun run test with turbo env
        working-directory: packages/util
        continue-on-error: true
        env:
          TURBO_HASH: deadbeef
          TURBO_TASK_HAS_CACHE: "true"
          FORCE_COLOR: "1"
        run: bun run test 2>&1 | tail -20
